[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coreflow-mtp"
version = "0.1.0"
description = "Isolated CoreFlow control plane and native vLLM V1 MTP adapter"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
# Install/validate the GPU environment separately; never upgrade an existing
# CoreFlow environment just to install the engine-independent controller.
engine = ["vllm==0.18.1"]
legacy = ["scipy>=1.8", "scikit-learn>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["coreflow_mtp*"]
